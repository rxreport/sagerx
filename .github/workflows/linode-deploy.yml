name: Deploy to Linode

on:
  push:
    branches: [deploy]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host:     ${{ secrets.LINODE_HOST }}
          username: ${{ secrets.LINODE_USER }}
          key:      ${{ secrets.LINODE_SSH_KEY }}
          envs: UMLS_KEY
          script: |
            export UMLS_API="${UMLS_KEY}"
            /opt/rxreport/rxreport-app/sagerx/deploy-sagerx.sh
        env:
          UMLS_KEY: ${{ secrets.UMLS_KEY }}
