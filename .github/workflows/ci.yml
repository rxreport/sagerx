# CI for the rxreport fork of SageRx.
#
# Until this file nothing ran on this repo: no workflow, no test runner. The guard scripts
# under airflow/dags/ (check_start_dates.py, check_marts_coverage.py, the test_*.py proofs)
# each said so in their own docstrings and were run by hand, or not at all.
#
# What this proves, in order:
#   1. the Airflow image still builds from airflow/Dockerfile;
#   2. every existing guard and test script passes, inside that image's Python (3.7 today);
#   3. every DAG imports the way the scheduler imports it (ci/dagbag_check.py), and that
#      check can fail: ci/dagbag_mutants.py breaks each thing it checks and requires red.
#
# Why (3) is the one that matters: a DAG that fails to import fails nothing on the box. It
# lands in the import_error table and stops being scheduled, and AIRFLOW_DAG_HEALTH reads
# dag RUNS, so it cannot see a DAG that has none. Every stage of the Airflow 2.5.1 -> 3.x
# migration (Cortex project sagerx-airflow-modernisation) changes import paths, and this is
# the check each stage is verified by before it reaches the warehouse.
#
# ⚠ This builds the Dockerfile; it does not pull the production image. Prod runs
# ghcr.io/rxreport/rxreport-data/sagerx-airflow, which is private and built by rxreport-data's
# "Docker build & push" from this same Dockerfile (this repo is that repo's apps/sagerx
# submodule). requirements.txt is unpinned, so a fresh build RE-RESOLVES it. Measured
# 2026-10-24: a fresh build resolved apache-airflow 2.5.1, Python 3.7.16 and dbt-core 1.5.11,
# the same three versions running on the warehouse that day. Pinning to Airflow's constraints
# file is the next migration stage.
#
# Nothing here deploys. A change reaches the warehouse only when rxreport-data bumps its
# apps/sagerx pointer and merges.
name: CI

on:
  pull_request: {}
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE: sagerx-airflow-ci

jobs:
  airflow:
    name: Airflow image, guards and DAG parse
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Build the Airflow image (airflow/Dockerfile)
        run: |
          docker build --pull -t "$IMAGE" airflow
          docker run --rm --entrypoint bash "$IMAGE" -c 'airflow version; python --version; pip show dbt-core | grep -i "^version"'

      - name: Guards and test scripts, in the image's Python
        run: |
          # Each script locates its inputs relative to its own file (check_marts_coverage.py
          # reads ../../dbt/sagerx), so the whole checkout is mounted at the same layout.
          docker run --rm -v "$PWD:/src:ro" -w /tmp --entrypoint bash "$IMAGE" -c '
            set -u
            rc=0
            run() { echo "::group::$*"; python "$@"; r=$?; echo "::endgroup::"; echo "rc=$r  $*"; [ "$r" -eq 0 ] || rc=1; }
            run /src/airflow/dags/check_start_dates.py --self-test
            run /src/airflow/dags/check_start_dates.py
            run /src/airflow/dags/check_marts_coverage.py --self-test
            run /src/airflow/dags/check_marts_coverage.py
            n=0
            for t in $(find /src/airflow/dags -name "test_*.py" -not -path "*/__pycache__/*" | sort); do
              run "$t"; n=$((n + 1))
            done
            if [ "$n" -eq 0 ]; then
              echo "::error::found no test_*.py under airflow/dags, so no test script ran"
              exit 4
            fi
            echo "$n test script(s) ran"
            exit "$rc"'

      - name: Every DAG imports (ci/dagbag_check.py), and the check can fail (ci/dagbag_mutants.py)
        run: |
          # Parsed the way the scheduler parses: the dags tree and prod's airflow.cfg mounted at
          # the paths docker-compose.sagerx.prod.yml mounts them at. Only what a CI box cannot
          # have is replaced: a throwaway SQLite metadata DB, placeholder Variables (vsac reads
          # umls_api at import), and a warehouse address that can never resolve, so a DAG that
          # queries the warehouse while being parsed fails in one recognisable way (dbt_gcp,
          # named in dagbag_check.py's PARSE_TIME_WAREHOUSE).
          docker run --rm \
            -e AIRFLOW__DATABASE__SQL_ALCHEMY_CONN=sqlite:////tmp/airflow-ci.db \
            -e AIRFLOW__CORE__EXECUTOR=SequentialExecutor \
            -e AIRFLOW__CORE__LOAD_EXAMPLES=False \
            -e AIRFLOW_VAR_UMLS_API=ci-placeholder \
            -e AIRFLOW_VAR_SLACK_API=ci-placeholder \
            -e AIRFLOW_CONN_POSTGRES_DEFAULT=postgresql://sagerx:sagerx@warehouse.invalid:5432/sagerx \
            -e CONNECTION_CHECK_MAX_COUNT=0 \
            -v "$PWD/airflow/dags:/opt/airflow/dags:ro" \
            -v "$PWD/airflow/config/airflow.cfg:/opt/airflow/airflow.cfg:ro" \
            -v "$PWD/ci:/ci:ro" \
            "$IMAGE" bash -c '
              airflow db init > /tmp/db-init.log 2>&1 || { cat /tmp/db-init.log; echo "::error::airflow db init failed, so nothing was parsed"; exit 4; }
              python /ci/dagbag_check.py || exit $?
              echo
              python /ci/dagbag_mutants.py'
